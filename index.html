<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>遊牧民 | AR名刺</title>
  <meta name="description" content="名刺のQRにかざすと遊牧民くんが立ちます。リベシティのプロフィールはこちら。">
  <meta property="og:title" content="遊牧民 | AR名刺">
  <meta property="og:description" content="名刺のQRにかざすと遊牧民くんが立ちます。リベシティのプロフィールはこちら。">
  <meta property="og:image" content="https://yubokumin28.github.io/yubokumin-card/og.png">
  <link rel="icon" href="qr_logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <!-- A-Frame + AR.js(マーカー型)+ つまんで大きくする -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
  <script>
    // 遊牧民くんを常にカメラの方へ向ける(Y軸だけ)。どこから覗いても板が線にならない
    AFRAME.registerComponent('face-camera-y', {
      tick: function () {
        var cam = this.el.sceneEl.camera; if (!cam) return;
        var obj = this.el.object3D, wp = new THREE.Vector3();
        cam.getWorldPosition(wp);
        var lp = obj.parent.worldToLocal(wp);
        obj.rotation.set(0, Math.atan2(lp.x - obj.position.x, lp.z - obj.position.z), 0);
      }
    });
  </script>
  <style>
    :root{--ink:#3b2a1a;--teal:#3f8f8a;--rust:#b0512e;--bg:#f6efe3}
    html,body{margin:0;height:100%;background:var(--bg);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif}
    body{overflow:hidden}
    #hint{position:fixed;left:12px;right:12px;top:12px;z-index:10;background:rgba(59,42,26,.84);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;text-align:center}
    #hint b{color:#ffd9a3}
    #found{display:none}
    #panel{position:fixed;left:12px;right:12px;bottom:14px;z-index:10;display:flex;flex-direction:column;gap:8px}
    .btn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-radius:14px;text-decoration:none;font-weight:900;font-size:16px;box-shadow:0 8px 18px rgba(0,0,0,.25)}
    .btn .sub{display:block;font-size:12px;font-weight:700;opacity:.85}
    .primary{background:var(--teal);color:#fff}
    .ghost{background:rgba(255,250,242,.94);color:var(--ink);font-size:14px;padding:12px 18px;box-shadow:none}
    .gift{position:fixed;left:12px;right:12px;bottom:150px;z-index:9;background:rgba(255,247,234,.94);border:2px dashed var(--rust);border-radius:14px;padding:8px 12px;font-size:13px;color:var(--ink);text-align:center;line-height:1.45}
    .gift b{color:var(--rust);font-size:16px}
    #fallback{display:none;position:fixed;inset:0;z-index:5;background:var(--bg);text-align:center;padding-top:90px}
    #fallback img{width:52vw;max-width:220px}
  </style>
</head>
<body>
  <div id="hint">
    <span id="wait">📷 カメラを許可して、<b>名刺のQRコード</b>にかざしてください</span>
    <span id="found">🎉 遊牧民くん登場！ <b>つまむと大きく</b>なります</span>
  </div>

  <div id="fallback"><img src="yubokumin.png" alt="遊牧民くん"></div>

  <div class="gift">🎁 この名刺を見せてくれた方限定 <b>AI相談 30分 無料</b><br>チャットで「名刺見ました」と一言ください</div>
  <div id="panel">
    <a class="btn primary" href="https://libecity.com/user_profile/c0bL05vIXaYL1a2dpMrWYBSbGEI3" target="_blank" rel="noopener">
      <span>リベシティのプロフィールを見る<span class="sub">フォロー・チャットはこちらから</span></span><span>→</span>
    </a>
    <a class="btn ghost" href="m/" target="_blank" rel="noopener"><span>出品している道具を見る(スキルマーケット)</span><span>→</span></a>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; patternRatio: 0.8;"
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    gesture-detector
    id="scene">

    <a-assets>
      <img id="seal" src="yubokumin.png" crossorigin="anonymous">
      <img id="label" src="label.png" crossorigin="anonymous">
    </a-assets>

    <a-marker type="pattern" url="pattern-yubokumin.patt" patternRatio="0.8" emitevents="true" id="marker">
      <!-- 外側: カメラの方を向く / 内側: つまんで拡大(rotationFactor 0 = 指で回さない) -->
      <a-entity face-camera-y>
        <a-entity class="clickable" gesture-handler="minScale: 0.4; maxScale: 4; rotationFactor: 0">
          <a-plane src="#seal" transparent="true" width="1.24" height="2" position="0 0.95 0" rotation="-12 0 0" side="double"
                   animation="property: position; from: 0 0.95 0; to: 0 1.1 0; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine"></a-plane>
          <a-plane src="#label" transparent="true" width="2.2" height="0.54" position="0 2.25 0" rotation="-12 0 0" side="double"></a-plane>
        </a-entity>
      </a-entity>
      <a-circle color="#3b2a1a" opacity="0.25" radius="0.55" rotation="-90 0 0" position="0 0.01 0"></a-circle>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    var m = document.getElementById('marker');
    m.addEventListener('markerFound', function () {
      document.getElementById('wait').style.display = 'none';
      document.getElementById('found').style.display = 'inline';
    });
    m.addEventListener('markerLost', function () {
      document.getElementById('found').style.display = 'none';
      document.getElementById('wait').style.display = 'inline';
    });
    // カメラが使えない端末(PCなど)でも遊牧民くんとボタンは見える
    window.addEventListener('camera-error', function(){ document.getElementById('fallback').style.display = 'block'; document.getElementById('wait').textContent = 'カメラが使えないので、遊牧民くんは静止画でご挨拶'; });
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { window.dispatchEvent(new Event('camera-error')); }
  </script>
</body>
</html>
