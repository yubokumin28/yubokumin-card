<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>AR marker detection test (image source, same scene as index.html)</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
  <script>
    AFRAME.registerComponent('face-camera-y', {
      tick: function () {
        var cam = this.el.sceneEl.camera; if (!cam) return;
        var obj = this.el.object3D, wp = new THREE.Vector3();
        cam.getWorldPosition(wp);
        var lp = obj.parent.worldToLocal(wp);
        obj.rotation.set(0, Math.atan2(lp.x - obj.position.x, lp.z - obj.position.z), 0);
      }
    });
  </script>
  <style>body{margin:0;overflow:hidden}#log{position:fixed;top:8px;left:8px;z-index:10;background:#000c;color:#0f0;font:14px monospace;padding:8px}</style>
</head>
<body>
  <div id="log">waiting…</div>
  <a-scene embedded arjs="sourceType: image; sourceUrl: test_marker_photo.jpg; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; patternRatio: 0.8;" vr-mode-ui="enabled: false;" gesture-detector>
    <a-assets><img id="seal" src="yubokumin.png"><img id="label" src="label.png"></a-assets>
    <a-marker type="pattern" url="pattern-yubokumin.patt" patternRatio="0.8" emitevents="true" id="marker">
      <a-entity face-camera-y>
        <a-entity class="clickable" gesture-handler="minScale: 0.4; maxScale: 4; rotationFactor: 0">
          <a-plane src="#seal" transparent="true" width="1.24" height="2" position="0 0.95 0" rotation="-12 0 0" side="double"></a-plane>
          <a-plane src="#label" transparent="true" width="2.2" height="0.54" position="0 2.25 0" rotation="-12 0 0" side="double"></a-plane>
        </a-entity>
      </a-entity>
      <a-circle color="#3b2a1a" opacity="0.25" radius="0.55" rotation="-90 0 0" position="0 0.01 0"></a-circle>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    window.__found = 0; window.__lost = 0;
    var m = document.getElementById('marker');
    m.addEventListener('markerFound', function(){ window.__found++; document.getElementById('log').textContent = 'markerFound x' + window.__found; });
    m.addEventListener('markerLost', function(){ window.__lost++; });
  </script>
</body>
</html>
