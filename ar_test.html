<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>AR marker detection test (image source)</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>body{margin:0;overflow:hidden}#log{position:fixed;top:8px;left:8px;z-index:10;background:#000c;color:#0f0;font:14px monospace;padding:8px}</style>
</head>
<body>
  <div id="log">waiting…</div>
  <a-scene embedded arjs="sourceType: image; sourceUrl: test_marker_photo.jpg; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; patternRatio: 0.8;" vr-mode-ui="enabled: false;">
    <a-assets><img id="seal" src="yubokumin.png"></a-assets>
    <a-marker type="pattern" url="pattern-yubokumin.patt" patternRatio="0.8" emitevents="true" id="marker">
      <a-plane src="#seal" transparent="true" width="1.24" height="2" position="0 0.95 -0.2" rotation="-25 0 0" side="double"></a-plane>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    window.__found = 0; window.__lost = 0;
    var m = document.getElementById('marker');
    m.addEventListener('markerFound', function(){ window.__found++; document.getElementById('log').textContent = 'markerFound x' + window.__found; });
    m.addEventListener('markerLost', function(){ window.__lost++; });
  </script>
</body>
</html>
